<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Sưu Tập - Vietnam Travel Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00C9A7; --cyan: #20D9E8; --bg-dark: #031B27; --white: #FFFFFF; }
        body {
            margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--white);
            background: linear-gradient(rgba(3, 27, 39, 0.85), rgba(3, 27, 39, 0.95)), url("bg.jpg") center/cover fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        
        /* HEADER VÀ TAB MỤC */
        .header { width: 100%; max-width: 1000px; padding: 30px 20px 10px 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { text-decoration: none; color: var(--white); background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; font-weight: 600; font-size: 14px; }
        .back-btn:hover { background: rgba(32, 217, 232, 0.2); border-color: var(--cyan); color: var(--cyan); }
        .page-title { font-family: 'Outfit', sans-serif; font-size: 28px; margin: 0; text-shadow: 0 0 15px rgba(32,217,232,0.4); text-align: right; }

        .tabs-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0 30px 0; width: 100%; padding: 0 20px; box-sizing: border-box; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--white); padding: 12px 25px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; flex: 1; max-width: 200px; }
        .tab-btn.active { background: linear-gradient(135deg, rgba(32, 217, 232, 0.2), rgba(0, 201, 167, 0.2)); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 5px 15px rgba(32,217,232,0.2); }

        /* LƯỚI ẢNH VÀ HIỆU ỨNG POP-IN */
        .gallery-container { width: 100%; max-width: 1000px; padding: 0 20px 20px 20px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        
        .gallery-item { 
            position: relative; border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            aspect-ratio: 1 / 1; 
            opacity: 0; 
            transform: translateY(40px) scale(0.8); /* Bắt đầu từ vị trí thấp và nhỏ */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        /* Chạy animation nảy lên khi class .loaded được thêm vào */
        .gallery-item.loaded { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .gallery-item:hover { transform: scale(1.03) !important; z-index: 2; box-shadow: 0 15px 30px rgba(32,217,232,0.4); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.4s; }
        .gallery-item:hover img { filter: brightness(1.1); }
        
        /* LOADING */
        .loading-text { width: 100%; text-align: center; font-style: italic; color: var(--cyan); padding: 20px 0; }
        #scroll-trigger { width: 100%; height: 50px; } /* Mốc cảm biến cuộn */

        /* LIGHTBOX PHÓNG TO ẢNH (Bỏ text) */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; opacity: 0; transition: opacity 0.3s; }
        .lightbox.active { display: flex; opacity: 1; }
        .lightbox img { max-width: 95%; max-height: 85vh; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); object-fit: contain; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; cursor: pointer; transition: 0.3s; }
        .lightbox-close:hover { color: #ff4d4d; }

        @keyframes popIn { 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        @media screen and (max-width: 600px) {
            .header { flex-direction: column-reverse; gap: 15px; padding: 20px 10px 10px; align-items: flex-start; }
            .page-title { font-size: 24px; text-align: left; }
            .gallery-container { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
            .tabs-container { padding: 0 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">← Về Bản Đồ</a>
        <h1 class="page-title">Khoảnh Khắc Hành Trình 📸</h1>
    </div>

    <!-- 2 NÚT TAB -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('banthan')">👤 Ảnh Bản Thân</button>
        <button class="tab-btn" onclick="switchTab('khungcanh')">⛰️ Khung Cảnh</button>
    </div>

    <!-- VÙNG CHỨA ẢNH -->
    <div class="gallery-container" id="gallery-box"></div>
    <div class="loading-text" id="loading-text">Đang tải ảnh...</div>
    
    <!-- CẢM BIẾN TỰ ĐỘNG CUỘN -->
    <div id="scroll-trigger"></div>

    <!-- LIGHTBOX (KHUNG PHÓNG TO TRƠN KHÔNG CHỮ) -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        // --- CẤU HÌNH KHO GITHUB CỦA BẠN ---
        const GITHUB_OWNER = "HeroDuy"; 
        const GITHUB_REPO = "Dau-an-Hero-Duy"; 

        let cachedData = { banthan: null, khungcanh: null };
        let currentTab = 'banthan'; 
        let currentIndex = 0; 
        const imagesPerLoad = 12; // Số ảnh nạp ra mỗi lần vuốt
        let isFetching = false; // Ngăn chặn load trùng lặp

        // Hàm gọi API lấy ảnh từ GitHub
        async function fetchImagesFromFolder(folderName) {
            if (cachedData[folderName]) return cachedData[folderName]; 
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${folderName}`);
                if (!response.ok) throw new Error("Thư mục trống");
                const files = await response.json();
                
                // Trả về duy nhất link ảnh (không có caption)
                const formattedImages = files
                    .filter(file => file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i))
                    .map(img => img.download_url);

                cachedData[folderName] = formattedImages;
                return formattedImages;
            } catch (error) {
                console.error("Lỗi:", error);
                return [];
            }
        }

        // Chuyển Tab
        async function switchTab(tabName) {
            currentTab = tabName;
            currentIndex = 0;
            const galleryBox = document.getElementById('gallery-box');
            const loadingText = document.getElementById('loading-text');
            
            galleryBox.innerHTML = ""; 
            loadingText.style.display = 'block';

            // Đổi màu nút Tab
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tabName === 'banthan');
            btns[1].classList.toggle('active', tabName === 'khungcanh');

            const images = await fetchImagesFromFolder(tabName);
            loadingText.style.display = 'none';

            if (images.length === 0) {
                galleryBox.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#aaa;">Chưa có ảnh nào. Vui lòng thả ảnh vào thư mục '${tabName}' trên kho GitHub.</div>`;
                return;
            }

            renderImages(images);
        }

        // Hiển thị ảnh (Nạp từng đợt)
        function renderImages(dataList) {
            if (!dataList || currentIndex >= dataList.length) return;
            isFetching = true;

            const galleryBox = document.getElementById('gallery-box');
            const endIndex = Math.min(currentIndex + imagesPerLoad, dataList.length);
            
            for (let i = currentIndex; i < endIndex; i++) {
                const src = dataList[i];
                const delay = (i - currentIndex) * 0.1; // Căn nhịp độ cho từng ảnh nảy lên nối tiếp nhau
                const html = `
                    <div class="gallery-item" style="animation-delay: ${delay}s" onclick="openLightbox('${src}')">
                        <img src="${src}" loading="lazy">
                    </div>
                `;
                galleryBox.insertAdjacentHTML('beforeend', html);
                
                // Mồi animation cho ảnh mới
                setTimeout(() => {
                    const items = galleryBox.querySelectorAll('.gallery-item:not(.loaded)');
                    items.forEach(el => el.classList.add('loaded'));
                }, 50);
            }
            
            currentIndex = endIndex;
            setTimeout(() => { isFetching = false; }, 500); // Mở khóa sau khi render xong
        }

        // ============================================
        // CẢM BIẾN TỰ ĐỘNG CUỘN (INFINITE SCROLL)
        // ============================================
        const observer = new IntersectionObserver((entries) => {
            // Khi người dùng cuộn đến cái mốc <div id="scroll-trigger">
            if (entries[0].isIntersecting && !isFetching) {
                if (cachedData[currentTab]) {
                    renderImages(cachedData[currentTab]);
                }
            }
        }, { rootMargin: "150px" }); // Kích hoạt sớm khi còn cách đáy 150px

        observer.observe(document.getElementById('scroll-trigger'));

        // Phóng to ảnh (Lightbox)
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto'; 
            setTimeout(() => document.getElementById('lightbox-img').src = "", 300);
        }

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        // Chạy tab mặc định khi vào web
        switchTab('banthan');

    </script>
</body>
</html>
