<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Sưu Tập - Vietnam Travel Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00C9A7; --cyan: #20D9E8; --bg-dark: #031B27; --white: #FFFFFF; }
        body {
            margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--white);
            background: linear-gradient(rgba(3, 27, 39, 0.85), rgba(3, 27, 39, 0.95)), url("bg.jpg") center/cover fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        
        /* HEADER VÀ TAB MỤC */
        .header { width: 100%; max-width: 1000px; padding: 30px 20px 10px 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { text-decoration: none; color: var(--white); background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; font-weight: 600; font-size: 14px; }
        .back-btn:hover { background: rgba(32, 217, 232, 0.2); border-color: var(--cyan); color: var(--cyan); }
        .page-title { font-family: 'Outfit', sans-serif; font-size: 28px; margin: 0; text-shadow: 0 0 15px rgba(32,217,232,0.4); text-align: right; }

        .tabs-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0 30px 0; width: 100%; padding: 0 20px; box-sizing: border-box; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--white); padding: 12px 25px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; flex: 1; max-width: 200px; }
        .tab-btn.active { background: linear-gradient(135deg, rgba(32, 217, 232, 0.2), rgba(0, 201, 167, 0.2)); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 5px 15px rgba(32,217,232,0.2); }

        /* LƯỚI ẢNH */
        .gallery-container { width: 100%; max-width: 1000px; padding: 0 20px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: 0.3s; aspect-ratio: 1 / 1; animation: fadeIn 0.5s ease forwards; opacity: 0; transform: translateY(10px); }
        .gallery-item.loaded { opacity: 1; transform: translateY(0); }
        .gallery-item:hover { transform: scale(1.03); z-index: 2; box-shadow: 0 15px 30px rgba(32,217,232,0.3); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .gallery-item:hover img { filter: brightness(1.1); }
        
        .image-caption { position: absolute; bottom: 0; left: 0; width: 100%; padding: 25px 10px 10px; box-sizing: border-box; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-size: 12px; font-weight: 600; text-align: center; pointer-events: none; }

        /* LOADING & TẢI THÊM */
        .loading-text { width: 100%; text-align: center; font-style: italic; color: var(--cyan); padding: 20px 0; }
        .load-more-container { width: 100%; text-align: center; margin: 30px 0 50px 0; }
        .load-more-btn { background: var(--cyan); color: #000; border: none; padding: 12px 30px; border-radius: 20px; font-weight: 700; cursor: pointer; font-size: 14px; transition: 0.3s; display: none; }
        .load-more-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(32,217,232,0.3); }

        /* LIGHTBOX PHÓNG TO ẢNH */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; opacity: 0; transition: opacity 0.3s; }
        .lightbox.active { display: flex; opacity: 1; }
        .lightbox img { max-width: 95%; max-height: 85vh; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); object-fit: contain; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; cursor: pointer; transition: 0.3s; }
        .lightbox-close:hover { color: #ff4d4d; }
        .lightbox-caption { margin-top: 15px; font-size: 16px; color: var(--cyan); font-weight: 600; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        @media screen and (max-width: 600px) {
            .header { flex-direction: column-reverse; gap: 15px; padding: 20px 10px 10px; align-items: flex-start; }
            .page-title { font-size: 24px; text-align: left; }
            .gallery-container { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
            .tabs-container { padding: 0 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">← Về Bản Đồ</a>
        <h1 class="page-title">Khoảnh Khắc Hành Trình 📸</h1>
    </div>

    <!-- 2 NÚT TAB -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('banthan')">👤 Ảnh Bản Thân</button>
        <button class="tab-btn" onclick="switchTab('khungcanh')">⛰️ Khung Cảnh</button>
    </div>

    <!-- VÙNG CHỨA ẢNH -->
    <div class="gallery-container" id="gallery-box"></div>
    <div class="loading-text" id="loading-text">Đang tải ảnh từ bộ nhớ...</div>

    <!-- NÚT TẢI THÊM -->
    <div class="load-more-container">
        <button class="load-more-btn" id="load-more-btn" onclick="loadMore()">Tải thêm ảnh ↓</button>
    </div>

    <!-- LIGHTBOX (KHUNG PHÓNG TO) -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script>
        // --- CẤU HÌNH KHO GITHUB CỦA BẠN ---
        const GITHUB_OWNER = "HeroDuy"; // Tên tài khoản GitHub
        const GITHUB_REPO = "Dau-an-Hero-Duy"; // Tên kho chứa mã nguồn

        let cachedData = { banthan: null, khungcanh: null };
        let currentTab = 'banthan'; 
        let currentIndex = 0; 
        const imagesPerLoad = 8; // Số ảnh load ra mỗi lần (chống giật)

        // Tự động vào GitHub quét thư mục lấy ảnh
        async function fetchImagesFromFolder(folderName) {
            if (cachedData[folderName]) return cachedData[folderName]; // Nếu đã tải rồi thì không tải lại
            
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${folderName}`);
                if (!response.ok) throw new Error("Folder rỗng hoặc không tồn tại");
                const files = await response.json();
                
                // Lọc chỉ lấy file ảnh
                const images = files.filter(file => file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i));
                
                const formattedImages = images.map(img => {
                    // Biến tên file thành caption: "Ngắm-hoàng-hôn.jpg" -> "Ngắm hoàng hôn"
                    let captionText = decodeURIComponent(img.name).replace(/\.[^/.]+$/, "").replace(/-/g, " ");
                    return {
                        src: img.download_url,
                        caption: captionText
                    };
                });

                cachedData[folderName] = formattedImages;
                return formattedImages;
            } catch (error) {
                console.error("Lỗi:", error);
                return [];
            }
        }

        async function switchTab(tabName) {
            currentTab = tabName;
            currentIndex = 0;
            const galleryBox = document.getElementById('gallery-box');
            const loadingText = document.getElementById('loading-text');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            galleryBox.innerHTML = ""; 
            loadMoreBtn.style.display = 'none';
            loadingText.style.display = 'block';

            // Đổi màu nút Tab
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tabName === 'banthan');
            btns[1].classList.toggle('active', tabName === 'khungcanh');

            // Quét ảnh từ GitHub
            const images = await fetchImagesFromFolder(tabName);
            loadingText.style.display = 'none';

            if (images.length === 0) {
                galleryBox.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#aaa;">Chưa có ảnh nào trong mục này. Vui lòng tải ảnh vào thư mục '${tabName}' trên GitHub.</div>`;
                return;
            }

            renderImages(images);
        }

        function renderImages(dataList) {
            const galleryBox = document.getElementById('gallery-box');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            const endIndex = Math.min(currentIndex + imagesPerLoad, dataList.length);
            
            for (let i = currentIndex; i < endIndex; i++) {
                const item = dataList[i];
                const delay = (i - currentIndex) * 0.05; 
                const html = `
                    <div class="gallery-item" style="animation-delay: ${delay}s" onclick="openLightbox('${item.src}', '${item.caption}')">
                        <img src="${item.src}" alt="${item.caption}" loading="lazy">
                        <div class="image-caption">${item.caption}</div>
                    </div>
                `;
                galleryBox.insertAdjacentHTML('beforeend', html);
                
                setTimeout(() => {
                    const items = galleryBox.querySelectorAll('.gallery-item:not(.loaded)');
                    items.forEach(el => el.classList.add('loaded'));
                }, 50);
            }
            
            currentIndex = endIndex;
            loadMoreBtn.style.display = (currentIndex >= dataList.length) ? 'none' : 'inline-block';
        }

        function loadMore() {
            renderImages(cachedData[currentTab]);
        }

        function openLightbox(src, caption) {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').innerText = caption;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto'; 
            setTimeout(() => document.getElementById('lightbox-img').src = "", 300);
        }

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        // Khởi động
        switchTab('banthan');

    </script>
</body>
</html>
